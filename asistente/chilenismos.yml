# Traductor de chilenismos del asistente.
#
# Antes de analizar una pregunta, la red cambia estas expresiones por su
# equivalente neutro. Así «¿cuántas lucas pides?» se entiende igual que
# «¿cuánto dinero pides?». Un valor vacío ("") elimina la palabra.
#
# Se escriben en minúsculas; las tildes no importan (se quitan al comparar).
# Se aceptan frases de hasta 3 palabras. Lista escrita a mano a partir del
# uso cotidiano; ante dudas de significado, consultar el Diccionario de uso
# del español de Chile (DUECh) de la Academia Chilena de la Lengua.

