    respuesta: >-
      Interrogatorio es un juego de deducción: abres un expediente, revisas
      pruebas, interrogas sospechosos y buscas contradicciones. Lo difícil
      fue que la solución no se filtre: el caso se genera en el servidor a
      partir de una semilla y la API solo entrega lo que ya descubriste.
      Tiene límites de peticiones y 111 pruebas en el backend. Hecho con
      React, FastAPI y SQLAlchemy. [Ver Interrogatorio](interrogatorio/).
    sugerencias: [laboratorios, buenas_practicas]

  - id: laboratorios
    claves: [datalab, docflow, cloudops, csv, excel, facturas, ocr, monitoreo, procesamiento de datos, limpieza de datos]
    ejemplos:
      - ¿qué es datalab?
      - ¿qué es docflow?
      - ¿qué es cloudops?
      - herramientas pequeñas
      - las utilidades
      - ¿tienes algo de procesamiento de datos?
      - ¿haces ocr?
      - limpieza de datos
      - extracción de facturas
      - monitoreo
    respuesta: >-
      Son tres herramientas que comparten un servidor FastAPI: DataLab limpia
      archivos CSV y Excel y muestra la calidad de cada columna; DocFlow
      extrae datos de facturas ficticias (texto, PDF u OCR) y exige revisión
      humana antes de aprobar; CloudOps mide si las apps del portafolio
      responden y registra incidentes. Cada visitante entra con una sesión
      temporal que se borra a las 24 horas.
    sugerencias: [backend, devops]

