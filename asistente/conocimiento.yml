    respuesta: >-
      TiendaNova es una tienda con catálogo, variantes, cupones, pedidos y
      devoluciones, más un panel de inventario (los pagos son simulados). Lo
      difícil fue el doble clic en «pagar»: el checkout es idempotente y el
      stock se descuenta en la misma transacción, así nunca se cobra dos
      veces ni se vende más de lo que hay. Hecho con Next.js, Auth.js, Prisma
      y PostgreSQL. [Ver TiendaNova](tiendanova/).
    sugerencias: [snake, concurrencia]

