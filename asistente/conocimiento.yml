    respuesta: >-
      Soy una red neuronal pequeña que Gervasio programó desde cero: un
      perceptrón multicapa escrito en Python con NumPy, sin librerías de
      machine learning. Se entrena con las preguntas que suelen hacer los
      reclutadores y se ejecuta en su navegador. Solo si no reconozco una
      pregunta consulto un modelo de IA externo, y lo indico en la respuesta.
      El detalle está en [cómo funciono](asistente/).
    respuesta_informal: >-
      Soy una red neuronal chica que Gervasio programó desde cero, en Python
      con NumPy, sin librerías de machine learning. Corro en tu navegador y,
      si no cacho una pregunta, le pido ayuda a una IA externa y te lo aviso.
