  - id: bodeganet
    claves: [bodeganet, .net, dotnet, c#, csharp, asp.net, entity framework, razor, inventario, kardex, bodega, stock, costo promedio]
    ejemplos:
      - háblame de bodeganet
      - ¿sabes .net?
      - ¿programas en c#?
      - ¿tienes algún proyecto en .net?
      - ¿has usado entity framework?
      - el sistema de inventario
      - ¿qué es el kardex?
      - ¿sabes asp.net core?
      - ¿cómo evitas el stock negativo?
    respuesta: >-
      BodegaNet es un control de inventario y kardex hecho en C# con .NET 10:
      ASP.NET Core (Razor Pages y una API REST documentada con OpenAPI),
      Entity Framework Core y PostgreSQL. Registra entradas con costo,
      salidas, ajustes y transferencias entre bodegas, y valoriza el kardex
      con costo promedio ponderado. Lo difícil fue que el stock nunca quede
      negativo aunque lleguen dos salidas a la vez: concurrencia optimista
      dentro de una transacción con reintentos y una restricción en la base;
      una prueba lanza 10 salidas simultáneas y comprueba que solo pasan las
      que caben. [Ver BodegaNet](bodeganet/) (puedes entrar como invitado).
    sugerencias: [concurrencia, otros_lenguajes]

