      - ¿cómo pauso el juego?
      - ¿cómo funciona el desafío diario?
      - ¿se puede jugar en el celular?
      - ¿cómo entro al ranking?
    respuesta: >-
      Snake tiene tres modos: Clásico, Sin paredes y Contrarreloj. Se juega
      con las flechas o con W, A, S y D, o deslizando el dedo en el teléfono,
      y se pausa con la barra espaciadora. Hay comidas especiales (dorada,
      lenta y escudo), un desafío diario y logros; para aparecer en el ranking
      se crea una cuenta y el servidor verifica la partida. [Jugar
      Snake](https://snake-gervasio-std.purpleocean-4aad06ee.chilecentral.azurecontainerapps.io/).
    respuesta_informal: >-
      Snake tiene tres modos: Clásico, Sin paredes y Contrarreloj. Te mueves
      con las flechas o W, A, S, D, o deslizando el dedo en el celu, y pausas
      con espacio. Hay comidas especiales, desafío diario y logros; para salir
