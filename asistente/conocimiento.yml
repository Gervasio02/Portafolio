      - adiós
      - nos vemos
      - hasta luego
      - eso es todo
      - me voy
      - bye
      - hasta pronto
    respuesta: >-
      ¡Gracias por pasar! Si quieres seguir la conversación con Gervasio,
      escríbele a [Gervasiot19@gmail.com](mailto:Gervasiot19@gmail.com).

