  - id: jugar_snake
    boton: "¿Cómo se juega Snake?"
    boton_informal: "¿Cómo se juega Snake?"
    claves: [cómo se juega snake, controles, modos de snake, contrarreloj, sin paredes, clásico]
    ejemplos:
