    respuesta: >-
      Lo que más me ha costado son los casos en que dos cosas pasan al mismo
      tiempo: dos reservas del mismo turno, dos clics en «pagar», dos personas
      moviendo tarjetas. Los resolví moviendo la regla a la base de datos
      (restricciones y transacciones) y escribiendo pruebas que repiten la
      situación. Mi forma de depurar viene de reparar máquinas: aislar y
      revisar pieza por pieza hasta encontrar la causa.
