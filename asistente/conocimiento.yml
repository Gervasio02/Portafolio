  - id: conceptos_api
    claves: [qué es una api, api rest, endpoint, json, http]
    ejemplos:
      - ¿cómo se comunican el frontend y el backend?
      - ¿qué es una api?
      - ¿qué es una api rest?
      - ¿qué es un endpoint?
      - explícame qué es rest
      - ¿para qué sirve una api?
    respuesta: >-
      Una API REST es la puerta por la que una aplicación pide o guarda datos
      en un servidor, usando direcciones (endpoints) y verbos HTTP como GET o
      POST, normalmente con JSON. En mis proyectos la pantalla en React habla
      con una API en Express, FastAPI o ASP.NET Core, que es donde aplico las
      reglas y los permisos.
    sugerencias: [backend, proyectos]

  - id: conceptos_docker_cicd
    claves: [qué es docker, contenedor, qué es ci cd, integración continua, pipeline, qué es devops]
    ejemplos:
      - ¿qué es docker?
      - ¿qué es un contenedor?
      - ¿qué es ci/cd?
      - ¿qué es la integración continua?
      - ¿qué es un pipeline?
      - explícame devops
    respuesta: >-
      Docker empaqueta una aplicación con todo lo que necesita para que
      funcione igual en cualquier máquina. CI/CD es automatizar el camino del
      código a producción: en cada cambio, GitHub Actions corre las pruebas,
      construye la imagen y, si todo pasa, la publica en Azure. Así trabajo
      todos los proyectos del portafolio.
    sugerencias: [devops, pruebas]

  - id: conceptos_pwa
    claves: [qué es una pwa, app instalable, service worker, offline]
    ejemplos:
      - ¿puedo instalar snake en el celular?
      - ¿qué es una pwa?
      - ¿qué significa que se pueda instalar?
      - ¿qué es un service worker?
      - ¿snake funciona sin internet?
      - ¿qué es una aplicación web progresiva?
    respuesta: >-
      Una PWA es una página web que se puede instalar como app en el teléfono
      o el computador. Snake lo es: tiene manifiesto, ícono y un service
      worker que guarda los archivos del juego, aunque el ranking necesita
      conexión con el servidor.
    sugerencias: [snake, frontend]

