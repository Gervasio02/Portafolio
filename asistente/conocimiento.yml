      - ¿cómo evitas trampas en el ranking?
      - proyecto de juego
      - ¿hiciste un juego?
      - pwa
    respuesta: >-
      Snake es el clásico de la serpiente con tres modos, desafío diario,
      logros y ranking; funciona en el teléfono y se instala como app. Lo
      difícil: un ranking sin trampas. El navegador no manda el puntaje sino
      la partida, y el servidor la vuelve a jugar con el mismo motor en
      TypeScript. Hecho con React, TypeScript, Express y Prisma.
      [Ver en la portada](index.html#snake).
    sugerencias: [interrogatorio, desafio]

  - id: interrogatorio
