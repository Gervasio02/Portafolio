      Si dispone de poco tiempo, le recomiendo TaskFlow: es el más cercano a
      un sistema de empresa, con roles, SLA, panel de control y 98,9 % de
      cobertura en la API. Si le interesa la lógica compleja, Snake: el
      servidor vuelve a jugar cada partida para que nadie haga trampa en el
      ranking.
    respuesta_informal: >-
      Si tienes poco tiempo, mira TaskFlow: es el más parecido a un sistema de
      empresa, con roles, SLA y 98,9 % de cobertura en la API. Si te tinca la
      lógica difícil, Snake: el servidor vuelve a jugar cada partida para que
      nadie haga trampa.
    sugerencias: [taskflow, snake, desafio]

  - id: taskflow
    boton: "¿De qué trata TaskFlow?"
    boton_informal: "¿Qué onda TaskFlow?"
    claves: [taskflow, kanban, tablero, tareas, sla, gestión de equipos]
    ejemplos:
      - háblame de taskflow
      - ¿qué es taskflow?
      - el kanban
      - tablero de tareas
      - ¿cómo funciona taskflow?
      - proyecto de gestión de equipos
      - taskflow stack
      - ¿qué fue lo difícil en taskflow?
    respuesta: >-
      TaskFlow es un tablero Kanban para equipos que preparan entregas y
      atienden incidentes; el panel muestra lo atrasado según el SLA de cada
      tarjeta. Lo difícil fue que el orden no se rompa cuando dos personas
      mueven tarjetas a la vez: las reordeno en una transacción en PostgreSQL
      y los permisos (dueño, editor, lector) se validan en la API. Hecho con
      React, Express, Prisma y PostgreSQL. [Ver TaskFlow](taskflow/).
    sugerencias: [reservaya, concurrencia]

  - id: reservaya
    boton: "¿De qué trata ReservaYa?"
    boton_informal: "¿Qué onda ReservaYa?"
    claves: [reservaya, reservas, canchas, turnos, reserva duplicada]
    ejemplos:
      - háblame de reservaya
      - ¿qué es reservaya?
      - reserva de canchas
      - el sistema de reservas
      - ¿cómo evitas reservas duplicadas?
      - reservaya stack
      - proyecto con fastapi
    respuesta: >-
      ReservaYa reserva canchas deportivas con tarifas según el horario,
      comprobante, cancelación y un panel de ocupación. Lo difícil: dos
      personas confirman el mismo turno en el mismo segundo. Una restricción
      en la base garantiza que solo una se lo quede y la otra recibe un
      mensaje claro; además cuidé las fechas con la zona horaria de Chile.
      Hecho con React, FastAPI, SQLAlchemy y PostgreSQL. [Ver ReservaYa](reservaya/).
    sugerencias: [tiendanova, bases_datos]

  - id: tiendanova
    boton: "¿De qué trata TiendaNova?"
    boton_informal: "¿Qué onda TiendaNova?"
    claves: [tiendanova, tienda, ecommerce, e-commerce, checkout, carrito, pagos, comercio electrónico]
    ejemplos:
      - háblame de tiendanova
      - ¿qué es tiendanova?
      - la tienda online
      - ecommerce
      - comercio electrónico
      - ¿cómo funciona el checkout?
      - ¿sabes hacer una tienda?
      - proyecto con next.js
    respuesta: >-
      TiendaNova es una tienda con catálogo, variantes, cupones, pedidos y
      devoluciones, más un panel de inventario (los pagos son simulados). Lo
      difícil fue el doble clic en «pagar»: el checkout es idempotente y el
      stock se descuenta en la misma transacción, así nunca se cobra dos
      veces ni se vende más de lo que hay. Hecho con Next.js, Auth.js, Prisma
      y PostgreSQL. [Ver TiendaNova](tiendanova/).
    sugerencias: [snake, concurrencia]

  - id: snake
    boton: "¿De qué trata Snake?"
    boton_informal: "¿Qué onda Snake?"
    claves: [snake, serpiente, juego, ranking, trampas, pwa, videojuego]
    ejemplos:
      - háblame de snake
      - el juego de la serpiente
      - ¿qué es snake?
      - ¿cómo evitas trampas en el ranking?
      - proyecto de juego
      - ¿hiciste un juego?
      - pwa
    respuesta: >-
      Snake es el clásico de la serpiente con tres modos, desafío diario,
      logros y ranking; funciona en el teléfono y se instala como app. Lo
      difícil: un ranking sin trampas. El navegador no manda el puntaje sino
      la partida, y el servidor la vuelve a jugar con el mismo motor en
      TypeScript. Hecho con React, TypeScript, Express y Prisma.
      [Ver en la portada](index.html#snake).
    sugerencias: [interrogatorio, desafio]

  - id: interrogatorio
    boton: "¿De qué trata Interrogatorio?"
    boton_informal: "¿Qué onda Interrogatorio?"
    claves: [interrogatorio, detective, deducción, sospechosos, expediente, caso policial]
    ejemplos:
      - háblame de interrogatorio
