  - id: taskflow
    claves: [taskflow, kanban, tablero, tareas, sla, gestión de equipos]
    ejemplos:
      - háblame de taskflow
      - ¿qué es taskflow?
      - el kanban
      - tablero de tareas
      - ¿cómo funciona taskflow?
      - proyecto de gestión de equipos
      - taskflow stack
      - ¿qué fue lo difícil en taskflow?
    respuesta: >-
      TaskFlow es un tablero Kanban para equipos que preparan entregas y
      atienden incidentes; el panel muestra lo atrasado según el SLA de cada
      tarjeta. Lo difícil fue que el orden no se rompa cuando dos personas
      mueven tarjetas a la vez: las reordeno en una transacción en PostgreSQL
      y los permisos (dueño, editor, lector) se validan en la API. Hecho con
      React, Express, Prisma y PostgreSQL. [Ver TaskFlow](taskflow/).
    sugerencias: [reservaya, concurrencia]

  - id: reservaya
