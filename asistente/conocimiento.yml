      comprobante, cancelación y un panel de ocupación. Lo difícil: dos
      personas confirman el mismo turno en el mismo segundo. Una restricción
      en la base garantiza que solo una se lo quede y la otra recibe un
      mensaje claro; además cuidé las fechas con la zona horaria de Chile.
      Hecho con React, FastAPI, SQLAlchemy y PostgreSQL. [Ver ReservaYa](reservaya/).
