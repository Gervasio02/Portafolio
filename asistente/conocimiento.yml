# Conocimiento del asistente «Pregúntale a mi portafolio».
#
# Cada intención tiene:
#   id:          nombre corto, único, sin espacios.
#   claves:      palabras sueltas que delatan la intención (tecnologías,
#                nombres de proyectos, sinónimos). La red también las aprende.
#   ejemplos:    formas en que alguien podría preguntarlo. Mientras más
#                variadas, mejor aprende la red (mínimo 6).
#   respuesta:   lo que contesta el asistente, en primera persona.
#                Enlaces con el formato [texto](ruta). Las rutas son
#                relativas a la raíz del sitio (ej.: cv.html, taskflow/).
#   sugerencias: (opcional) ids de otras intenciones para ofrecer después.
#   boton:       (opcional) texto formal del botón de sugerencia («¿Qué
#                tecnologías domina?»). Es el que se muestra primero.
#   boton_informal / respuesta_informal: (opcionales) versiones coloquiales
#                que se usan cuando el visitante escribe en tono informal
#                (chilenismos, abreviaturas). Si no existen, se usa la formal.
#
# Para enseñarle algo nuevo: agrega ejemplos a una intención existente o
# crea una intención nueva, y guarda. Al llegar a main, GitHub Actions
# vuelve a entrenar la red y publica el modelo (ver asistente/README.md).
#
# Regla: solo información real que Gervasio haya entregado. Si no hay
# dato, la respuesta invita a escribir por correo.

