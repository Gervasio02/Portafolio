    respuesta: >-
      Snake tiene tres modos: Clásico, Sin paredes y Contrarreloj. Te mueves
      con las flechas o con W, A, S y D, o deslizando el dedo en el teléfono,
      y pausas con la barra espaciadora. Hay comidas especiales (dorada, lenta
      y escudo), un desafío diario y logros; para aparecer en el ranking
      creas una cuenta y el servidor verifica tu partida.
      [Jugar Snake](https://snake-gervasio-std.purpleocean-4aad06ee.chilecentral.azurecontainerapps.io/).
