name: reservaya
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reservaya
      POSTGRES_PASSWORD: reservaya_local
      POSTGRES_DB: reservaya
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservaya -d reservaya"]
      interval: 3s
      timeout: 3s
      retries: 12
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://reservaya:reservaya_local@db:5432/reservaya
      JWT_SECRET: ${JWT_SECRET:-reservaya-local-only-use-a-different-key-in-production}
      COOKIE_SECURE: "false"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-CanchaDemo2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@reservaya.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminDemo2026}
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  pgdata:
