name: BodegaNet
on:
  workflow_dispatch:
  push:
    paths: ["bodeganet/**", ".github/workflows/bodeganet.yml"]
  pull_request:
    paths: ["bodeganet/**", ".github/workflows/bodeganet.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bodeganet
          POSTGRES_PASSWORD: solo_para_pruebas
          POSTGRES_DB: bodeganet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bodeganet -d bodeganet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bodeganet
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore BodegaNet.sln
      - run: dotnet build BodegaNet.sln --no-restore -c Release
      - name: Pruebas con SQLite
        run: dotnet test BodegaNet.sln --no-build -c Release --logger "console;verbosity=normal"
      - name: Pruebas con PostgreSQL
        if: ${{ !cancelled() }}
        env:
          BODEGANET_PRUEBAS_POSTGRES: Host=localhost;Port=5432;Username=bodeganet;Password=solo_para_pruebas;Database=bodeganet
        run: dotnet test BodegaNet.sln --no-build -c Release --logger "console;verbosity=normal"
      - name: Formato del código
        if: ${{ !cancelled() }}
        run: |
          if ! dotnet format BodegaNet.sln --verify-no-changes --no-restore; then
            dotnet format BodegaNet.sln --no-restore
            git diff
            exit 1
          fi
      - name: Imagen Docker
        if: ${{ !cancelled() }}
        run: docker build -t bodeganet:ci .
  desplegar:
    name: Publicar en Azure
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Construir, publicar y verificar
        env:
          REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
          REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-portafolio-gervasio' }}
          # Opcional: lo crea Gervasio en Settings → Secrets and variables → Actions.
          BODEGANET_DATABASE_URL: ${{ secrets.BODEGANET_DATABASE_URL }}
        run: |
          extra=()
          if [[ -n "${BODEGANET_DATABASE_URL:-}" ]]; then
            extra+=("DATABASE_URL=$BODEGANET_DATABASE_URL")
          else
            echo "::notice::Sin BODEGANET_DATABASE_URL: la demo usa SQLite y se reinicia al apagarse la app."
          fi
          scripts/azure-desplegar-app.sh bodeganet bodeganet /health 8080 \
            ASPNETCORE_ENVIRONMENT=Production "${extra[@]}"
