name: Publicar portada

# Prueba la portada (portal/) y la publica en GitHub Pages con el dominio
# https://gervasio.sbs en cada push a main que toque portal/.
# (La suscripción Azure for Students solo permite regiones donde Static Web
# Apps no existe; el destino Azure queda opcional por si cambia la suscripción.)
# Requisito único: Settings → Pages → Source: "GitHub Actions" y
# Custom domain: gervasio.sbs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "portal/**"
      - "asistente/**"
      - "tests/interrogatorio/**"
      - ".github/workflows/azure-portal.yml"
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "asistente/**"
      - "tests/interrogatorio/**"
      - ".github/workflows/azure-portal.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('portal-pr-{0}', github.event.pull_request.number) || 'portal-production' }}
  cancel-in-progress: true

jobs:
  probar:
    name: Probar portada
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/interrogatorio
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/interrogatorio/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: asistente/requirements.txt
      - name: Entrenar la red del asistente con conocimiento.yml
        working-directory: .
        run: |
          pip install -r asistente/requirements.txt
          python asistente/entrenar.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test


  github-pages:
    name: Publicar en GitHub Pages (gervasio.sbs)
    needs: probar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://gervasio.sbs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: asistente/requirements.txt
      - name: Entrenar la red del asistente con conocimiento.yml
        run: |
          pip install -r asistente/requirements.txt
          python asistente/entrenar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: portal
      - uses: actions/deploy-pages@v4

  verificar-publicacion:
    name: Verificar sitio publicado
    needs: github-pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar páginas y metadatos en producción
        shell: bash
        run: |
          set -euo pipefail

          base_url="https://gervasio.sbs"
          paths=("/" "/proyectos/" "/cv.html" "/robots.txt" "/sitemap.xml")

          for attempt in {1..18}; do
            published=true

            for path in "${paths[@]}"; do
              output="/tmp/portal$(printf '%s' "$path" | tr '/.' '__')"
              if ! curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 20 \
                "${base_url}${path}" \
                --output "$output"; then
                published=false
                break
              fi
            done

            root_file="/tmp/portal_"
            robots_file="/tmp/portal_robots_txt"
            sitemap_file="/tmp/portal_sitemap_xml"

            if [[ "$published" == true ]] \
              && grep -Fq '<link rel="canonical" href="https://gervasio.sbs/"' "$root_file" \
              && grep -Fq '<meta property="og:url" content="https://gervasio.sbs/"' "$root_file" \
              && grep -Fq '<meta property="og:image" content="https://gervasio.sbs/capturas/gervasio-social.jpg"' "$root_file" \
              && grep -Fq 'Sitemap: https://gervasio.sbs/sitemap.xml' "$robots_file" \
              && grep -Fq '<loc>https://gervasio.sbs/</loc>' "$sitemap_file"; then
              echo "La publicación está disponible y contiene los metadatos esperados."
              exit 0
            fi

            if [[ "$attempt" -lt 18 ]]; then
              echo "La publicación aún no está propagada (intento ${attempt}/18); reintentando en 10 segundos."
              sleep 10
            fi
          done

          echo "La publicación no quedó completa después de 18 intentos." >&2
          exit 1

  azure:
    name: Publicar en Azure Static Web Apps
    needs: probar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_STATIC_WEB_APPS_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: portal
          api_location: ""
          output_location: ""
          skip_app_build: true
