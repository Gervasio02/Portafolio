name: Publicar portada en Azure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - '.github/workflows/azure-portal.yml'

permissions:
  contents: read

concurrency:
  group: azure-portal-production
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.AZURE_STATIC_WEB_APPS_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: portal
          api_location: ''
          output_location: ''
          skip_app_build: true
