name: Publicar portada

# Prueba la portada (portal/) y la publica en Azure Static Web Apps
# (https://gervasio.sbs) en cada push a main que toque portal/.
# Requisitos: secreto AZURE_STATIC_WEB_APPS_API_TOKEN y variable
# AZURE_STATIC_WEB_APPS_READY=true en el repositorio.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "portal/**"
      - "tests/interrogatorio/**"
      - ".github/workflows/azure-portal.yml"
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "tests/interrogatorio/**"
      - ".github/workflows/azure-portal.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('portal-pr-{0}', github.event.pull_request.number) || 'portal-production' }}
  cancel-in-progress: true

jobs:
  probar:
    name: Probar portada
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/interrogatorio
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/interrogatorio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test


  azure:
    name: Publicar en Azure Static Web Apps
    needs: probar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_STATIC_WEB_APPS_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: portal
          api_location: ""
          output_location: ""
          skip_app_build: true
