name: Publicar portada en Azure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'portal/**'
      - 'tests/interrogatorio/**'
      - '.github/workflows/azure-portal.yml'
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'tests/interrogatorio/**'
      - '.github/workflows/azure-portal.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('azure-portal-pr-{0}', github.event.pull_request.number) || 'azure-portal-production' }}
  cancel-in-progress: true

jobs:
  test-interrogatorio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/interrogatorio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/interrogatorio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  deploy:
    needs: test-interrogatorio
    if: github.event_name != 'pull_request' && vars.AZURE_STATIC_WEB_APPS_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: portal
          api_location: ''
          output_location: ''
          skip_app_build: true
