name: Publicar imágenes para Azure

on:
  push:
    branches: [main]
    paths:
      - "taskflow/**"
      - "reservaya/**"
      - "tiendanova/**"
      - ".github/workflows/azure-images.yml"
  workflow_dispatch:
    inputs:
      registry:
        description: Registro de destino
        type: choice
        required: true
        default: ghcr
        options: [ghcr, azure]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: azure-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [taskflow, reservaya, tiendanova]
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Autenticar con Azure por OpenID Connect
        if: github.event_name == 'push' || inputs.registry == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compilar y publicar la imagen
        shell: bash
        env:
          APP_NAME: ${{ matrix.app }}
          TARGET_REGISTRY: ${{ inputs.registry || 'azure' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
          AZURE_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_REGISTRY" == azure ]]; then
            az acr login --name "$AZURE_REGISTRY_NAME" --only-show-errors
            image="${AZURE_REGISTRY_LOGIN_SERVER}/${APP_NAME}:${GITHUB_SHA}"
          else
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            repository="${GITHUB_REPOSITORY,,}"
            image="ghcr.io/${repository}-${APP_NAME}:${GITHUB_SHA}"
          fi

          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" "$APP_NAME"

          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          printf 'Imagen de `%s`: `%s@%s`\n' "$APP_NAME" "${image%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Actualizar Container App y verificar salud
        if: github.event_name == 'push' || inputs.registry == 'azure'
        shell: bash
        env:
          APP_NAME: ${{ matrix.app }}
          AZURE_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt
          container_app="${APP_NAME}-gervasio-std"
          resource_id=$(az resource list \
            --resource-type Microsoft.App/containerApps \
            --query "[?name=='${container_app}'].id | [0]" \
            --output tsv)
          if [[ -z "$resource_id" ]]; then
            echo "No se encontró la aplicación ${container_app}." >&2
            exit 1
          fi
          resource_group=$(cut -d/ -f5 <<<"$resource_id")
          image="${AZURE_REGISTRY_LOGIN_SERVER}/${APP_NAME}:${GITHUB_SHA}"
          az containerapp update \
            --name "$container_app" \
            --resource-group "$resource_group" \
            --image "$image" \
            --revision-suffix "${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}" \
            --only-show-errors
          fqdn=$(az containerapp show \
            --name "$container_app" \
            --resource-group "$resource_group" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          case "$APP_NAME" in
            taskflow|reservaya) health_path="/api/health" ;;
            tiendanova) health_path="/health" ;;
          esac
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              "https://${fqdn}${health_path}" >/dev/null; then
              printf 'Despliegue verificado: https://%s%s\n' "$fqdn" "$health_path" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "La nueva revisión no respondió en el tiempo esperado." >&2
          exit 1
