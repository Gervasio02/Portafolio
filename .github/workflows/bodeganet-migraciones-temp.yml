name: BodegaNet (generar migraciones, temporal)
on:
  push:
    branches: [claude/bodeganet]
    paths: ["bodeganet/**", ".github/workflows/bodeganet-migraciones-temp.yml"]
permissions:
  contents: read
jobs:
  generar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bodeganet
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool install --global dotnet-ef --version 10.0.15
      - run: rm -rf src/BodegaNet/Datos/Migraciones
      - run: dotnet ef migrations add Inicial --project src/BodegaNet --context BodegaSqliteContext --output-dir Datos/Migraciones/Sqlite
      - run: dotnet ef migrations add Inicial --project src/BodegaNet --context BodegaPostgresContext --output-dir Datos/Migraciones/Postgres
      - name: Volcar migraciones en base64
        run: |
          echo "INICIO-MIGRACIONES"
          tar czf - -C src/BodegaNet/Datos Migraciones | base64 -w0
          echo
          echo "FIN-MIGRACIONES"
