name: Laboratorios
on:
  push:
    paths: ["labs/**", ".github/workflows/labs.yml"]
  pull_request:
    paths: ["labs/**", ".github/workflows/labs.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/requirements.txt
      - run: pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q
