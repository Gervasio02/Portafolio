name: Laboratorios
on:
  workflow_dispatch:
  push:
    paths: ["labs/**", ".github/workflows/labs.yml"]
  pull_request:
    paths: ["labs/**", ".github/workflows/labs.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/requirements.txt
      - run: pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q
  desplegar:
    name: Publicar en Azure
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Construir, publicar y verificar
        env:
          REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
          REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-portafolio-gervasio' }}
          # Los dos los crea Gervasio en Settings → Secrets and variables → Actions.
          PANEL_CLAVE: ${{ secrets.PANEL_CLAVE }}
          ANALITICA_DB_URL: ${{ secrets.ANALITICA_DB_URL }}
        run: |
          extra=()
          if [[ -n "${PANEL_CLAVE:-}" ]]; then
            extra+=("PANEL_CLAVE=$PANEL_CLAVE")
          else
            echo "::warning::Falta el secreto PANEL_CLAVE: el panel privado quedará cerrado."
          fi
          if [[ -n "${ANALITICA_DB_URL:-}" ]]; then
            extra+=("ANALITICA_DB_URL=$ANALITICA_DB_URL")
          else
            echo "::warning::Sin ANALITICA_DB_URL: las visitas se guardan en SQLite y se pierden al apagarse la app."
          fi
          scripts/azure-desplegar-app.sh labs labs /health 8001 \
            APP_ENV=production LABS_GUEST_MODE=on RATE_LIMIT=on PORTAL_URL=https://gervasio.sbs \
            "PANEL_ORIGENES=https://gervasio.sbs,https://www.gervasio.sbs" "${extra[@]}"
