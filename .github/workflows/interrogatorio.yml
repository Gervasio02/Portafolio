name: Interrogatorio
on:
  push:
    paths: ["interrogatorio/**", ".github/workflows/interrogatorio.yml"]
  pull_request:
    paths: ["interrogatorio/**", ".github/workflows/interrogatorio.yml"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interrogatorio/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: interrogatorio/backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interrogatorio/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: interrogatorio/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
  desplegar:
    name: Publicar en Azure
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Construir, publicar y verificar
        env:
          REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
          REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-portafolio-gervasio' }}
          SECRETOS_ALEATORIOS: "jwt-secret:JWT_SECRET"
        run: |
          scripts/azure-desplegar-app.sh interrogatorio interrogatorio /ready 8000 \
            APP_ENV=production RATE_LIMIT=on
