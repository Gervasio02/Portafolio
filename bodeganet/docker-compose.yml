# BodegaNet con PostgreSQL local. Copia .env.example a .env antes de levantarlo.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodeganet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-bodeganet}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: postgres://${POSTGRES_USER:-bodeganet}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bodeganet}
    ports:
      - "8080:8080"
volumes:
  datos-postgres:
