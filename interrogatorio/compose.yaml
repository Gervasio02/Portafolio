services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interrogatorio
      POSTGRES_USER: detective
      POSTGRES_PASSWORD: detective
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detective -d interrogatorio"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://detective:detective@db:5432/interrogatorio
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  postgres_data:
